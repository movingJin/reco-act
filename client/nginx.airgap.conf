# airgap(폐쇄망) 웹 nginx 설정 (01-plan 4.2, 4.4). 브라우저 녹음에는 secure context가 필요해 HTTPS로 서비스한다.
# 인증서는 폐쇄망 내부 CA가 발급한 것을 /etc/nginx/tls에 마운트한다(번들에 넣지 않음).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/reco-act/locations.conf;
}
