# airgap 웹 공통 설정. nginx.airgap.conf(HTTPS)와 nginx.airgap-http.conf(HTTP, 모의 환경)가 include한다.

# 2시간 녹음(약 520MB)까지 public과 같은 한도.
client_max_body_size 500M;
client_body_timeout 600s;

root /usr/share/nginx/html;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 256 16k;
    proxy_max_temp_file_size 2048m;
    proxy_temp_file_write_size 256k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    # 요약 요청은 작업이 끝날 때까지 기다린다(airgap SUMMARY_WAIT_TIMEOUT 1500초). 그보다 길게 둔다(01-plan 3.7).
    proxy_read_timeout 1620s;
}

# API 문서(Swagger UI). airgap API가 이미지 안의 정적 파일로 띄운다(CDN 없음).
location = /docs {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
}
location = /openapi.json {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
}
location /docs-static/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
}
