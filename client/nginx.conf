server {
    listen 80;
    server_name _;

    # 모바일 녹음이 ~520kbps 수준이라 1h = 약 260MB. 2h(약 520MB)까지 여유 두고 설정.
    client_max_body_size 500M;
    # 느린 모바일 네트워크에서 업로드 중 끊기지 않도록 본문 수신 타임아웃 연장.
    client_body_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    # Try to serve the requested file, if not found, serve index.html
    # This is important for React Router to work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the server
    location /api/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 256k;
        # 업로드+STT 처리(Clova 5분)와 대용량 업로드를 위해 타임아웃 연장.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
