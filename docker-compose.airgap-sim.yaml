# airgap 모의 환경(airgap-sim, 2026-10-24 결정). GPU 서버가 없는 동안 public 서버에서 airgap 구성을 직접 써 보는 환경이다.
# - 앱은 airgap 프로파일 그대로다: faster-whisper 전사 + pyannote 화자분리 + 병합 + 용어 사전 + map-reduce 요약, airgap 웹 빌드.
# - 실제 airgap과 다른 점: STT·화자분리는 CPU(worker-cpu 이미지), LLM은 OpenRouter(외부)라 AIRGAP_STRICT=0이고
#   외부 연결을 막지 않는다. 웹은 HTTP로 열고 TLS는 서버 앞단의 리버스 프록시가 맡는다.
# - public 운영과 섞이지 않게 compose 프로젝트(-p reco-act-airgap-sim)·DB·Redis·데이터 디렉터리를 따로 쓴다.
# - 여기에 올린 음성의 전사·요약은 OpenRouter로 간다. 합성 음성과 결정자가 승인한 테스트 녹음만 올린다(00-decisions 3장).
#
# 배포는 .github/workflows/deploy-airgap-sim.yml(Actions 수동 실행)이 한다. 모델은 서버의 models/에 미리 올려 둔다(01-plan 4.6).
#   docker-compose -p reco-act-airgap-sim -f docker-compose.airgap-sim.yaml --env-file airgap-sim.env up -d --build
# 경로는 이 파일이 있는 디렉터리 기준이다. 실제 값은 airgap-sim.env(비밀, deploy/airgap-sim/airgap-sim.env.example 참고).

x-app-env: &app-env
  APP_PROFILE: airgap
  AIRGAP_STRICT: "0"  # LLM이 외부(OpenRouter)라 기동 검사를 끈다. 실제 airgap은 1
  ENVIRONMENT: prod
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYANNOTE_METRICS_ENABLED: "0"
  LLM_SERVING: openrouter
  LLM_BASE_URL: https://openrouter.ai/api/v1
  LLM_MODEL: ${SIM_LLM_MODEL:-qwen/qwen3-32b}
  # OpenRouter는 max_tokens가 없으면 최대 출력만큼 크레딧을 잡아 두어 키 한도가 작으면 402로 거부한다(01-plan 9.1).
  LLM_MAX_TOKENS: "${SIM_LLM_MAX_TOKENS:-8192}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  # Actions가 빌드한 airgap 웹(client/dist-airgap)을 nginx로 연다. 이미지를 따로 만들지 않는다.
  web:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${SIM_WEB_PORT:-23002}:80"
    volumes:
      - ./client/dist-airgap:/usr/share/nginx/html:ro
      - ./client/nginx.airgap-http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/nginx.airgap.locations.conf:/etc/nginx/reco-act/locations.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: reco-act-airgap-sim-api
    build:
      context: ./server
      dockerfile: Dockerfile.airgap
      target: api
    restart: unless-stopped
    env_file:
      - ./airgap-sim.env
    environment:
      <<: *app-env
    volumes:
      - ./data/records:/app/records
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # CPU로 돌므로 느리다(3분 음성에 faster-whisper small + pyannote 약 7분, 01-plan 4.4). public 서비스에 주는 영향을 줄이려고 CPU·메모리를 제한한다.
  worker:
    image: reco-act-airgap-sim-worker
    build:
      context: ./server
      dockerfile: Dockerfile.airgap
      target: worker-cpu
    restart: unless-stopped
    env_file:
      - ./airgap-sim.env
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "1"
      STT_PROVIDER: faster_whisper
      DIARIZER: pyannote
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      WHISPER_MODEL_PATH: /models/${SIM_WHISPER_MODEL_DIR:-faster-whisper-small}
      PYANNOTE_PIPELINE_PATH: /models/${SIM_PYANNOTE_PIPELINE_DIR:-speaker-diarization-community-1}
    volumes:
      - ./data/records:/app/records
      - ./models:/models:ro
    cpus: "${SIM_WORKER_CPUS:-4}"
    mem_limit: ${SIM_WORKER_MEMORY:-8g}
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    env_file:
      - ./airgap-sim.env  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
