services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "23001:80"
    container_name: reco-act-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: reco-act-server
    restart: unless-stopped
    volumes:
      - ./server/records:/app/records
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=prod
      - TZ=Asia/Seoul
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  server_data:
